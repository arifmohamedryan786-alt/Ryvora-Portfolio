<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In — RYVORA Agency Platform</title>
  
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <style>
    .form-alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 20px;
      display: none;
    }
    .form-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      border-top-color: currentColor;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="admin-body">

  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand Header -->
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 44px; height: 44px; border-radius: 10px; background: var(--admin-text-main); margin: 0 auto 14px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(10, 25, 47, 0.15);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; color: var(--admin-text-main); font-weight: 700; margin-bottom: 6px;">
          RYVORA Studio Portal
        </h1>
        <p style="font-size: 0.84rem; color: var(--admin-text-sub); margin: 0;">
          Agency Management &amp; Client Inquiries
        </p>
      </div>

      <div id="login-alert" class="form-alert" role="alert"></div>

      <!-- Login Form -->
      <form id="admin-login-form" novalidate>
        <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
          
          <div>
            <label for="admin-email" style="font-size: 0.8125rem; font-weight: 600; color: var(--admin-text-sub); display: block; margin-bottom: 6px;">
              Admin Email
            </label>
            <input 
              type="email" 
              id="admin-email" 
              name="email" 
              class="admin-input" 
              placeholder="admin@ryvora.agency" 
              style="padding-left: 14px;"
              required 
              autocomplete="email"
            />
          </div>

          <div>
            <label for="admin-password" style="font-size: 0.8125rem; font-weight: 600; color: var(--admin-text-sub); display: block; margin-bottom: 6px;">
              Password
            </label>
            <input 
              type="password" 
              id="admin-password" 
              name="password" 
              class="admin-input" 
              placeholder="••••••••••••" 
              style="padding-left: 14px;"
              required 
              autocomplete="current-password"
            />
          </div>

        </div>

        <button type="submit" class="admin-btn admin-btn-primary" style="width: 100%; padding: 12px; font-size: 0.9375rem;" id="login-submit-btn">
          Sign In to Dashboard
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--admin-card-border); text-align: center;">
        <a href="/" style="font-size: 0.8125rem; color: var(--admin-text-sub); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back to Public Website
        </a>
      </div>

    </div>
  </div>

  <script src="/admin/js/auth.js"></script>
</body>
</html>
